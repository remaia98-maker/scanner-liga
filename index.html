<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanner Liga</title>
<meta name="theme-color" content="#0F1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanner Liga">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Escuro, uma coluna. Início = busca; câmera contínua em tela cheia; lote e ficha da carta como camadas. */
:root{
  --bg:#0F1013; --surface:#17191D; --raised:#1E2025; --line:#2B2E35; --ink:#F4F5F7; --muted:#A7ABB7;
  --accent:#FFB23F; --accent-ink:#1A1205; --accent-soft:#3A2A10;
  --flag:#FF9D7A; --flag-bg:#3B1F17;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:800}

/* One Piece: mesmo layout, acento vermelho para deixar claro em qual Liga o lote vai entrar */
body[data-game="op"]{--accent:#FF7262;--accent-ink:#1C0806;--accent-soft:#3E1A16}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.games{display:flex;padding:3px;border-radius:999px;background:var(--raised);border:1px solid var(--line)}
.games button{min-height:34px;padding:0 14px;border:0;border-radius:999px;background:none;font-weight:700;font-size:13.5px;color:var(--muted)}
.games button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.note{padding:10px 12px;border-radius:10px;background:var(--raised);font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink)}

/* ---------- miniaturas: imagem oficial; sem ela, silhueta na cor do tipo ---------- */
.thumb{position:relative;flex:none;display:block;width:46px;aspect-ratio:63/88;border-radius:5px;overflow:hidden;background:var(--t,#4A4F5E)}
.thumb::before{content:"";position:absolute;left:12%;right:12%;top:20%;height:42%;border-radius:2px;background:rgba(255,255,255,.2)}
.thumb::after{content:"";position:absolute;left:8%;right:30%;top:7%;height:5%;border-radius:2px;background:rgba(255,255,255,.7)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:var(--raised)}
.thumb.s{width:38px;border-radius:4px}
.thumb.m{width:64px;border-radius:6px}
.thumb.l{width:120px;border-radius:9px}

/* ---------- início ---------- */
.view{max-width:560px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr);padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:130px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 8px 0 14px;border-radius:16px;background:var(--raised);border:1px solid var(--line)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-weight:600;font-size:16px}
.search input::placeholder{color:var(--muted);font-weight:500}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{width:40px;height:40px;border:0;background:none;color:var(--muted);border-radius:50%;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:8px 0;text-align:left}
.strip{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.strip .it{flex:none;width:64px;display:flex;flex-direction:column;gap:5px;border:0;background:none;padding:0;text-align:left}
.strip .it b{font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .it span{font:500 11px var(--f-mono);color:var(--muted);margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column;border-radius:16px;background:var(--surface);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid #24272D;background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:active{background:var(--raised)}
.row .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .nm b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .q{font:600 14px var(--f-mono)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:#24272D;color:#D3D6DE;white-space:nowrap}
.tag.x{background:var(--accent-soft);color:var(--accent)}
.tag.f{background:var(--flag-bg);color:var(--flag)}
.empty{padding:20px 18px;display:flex;flex-direction:column;gap:10px;border-radius:16px;background:var(--surface)}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);margin:0}
.notice{padding:12px 14px;border-radius:12px;background:var(--flag-bg);color:#FFD9CC;font-size:13.5px}

/* ---------- barras inferiores ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:var(--gut);padding-right:var(--gutr)}
.dock .in{max-width:560px;margin:0 auto;height:84px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;padding-top:12px}
.dock .side{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font-weight:600;font-size:12px;min-width:70px;min-height:48px;position:relative}
.dock .side svg{width:24px;height:24px}
.dock .badge{position:absolute;top:-6px;right:6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 11.5px var(--f-mono);display:flex;align-items:center;justify-content:center}
.fab{justify-self:center;margin-top:-46px;width:80px;height:80px;border-radius:50%;border:6px solid var(--bg);background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.fab:disabled{opacity:.5}
.fab svg{width:32px;height:32px}
.bar2 .in{display:flex;gap:10px;height:auto;padding:12px 0}
.btn{min-height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn.round{width:52px;padding:0;border-radius:50%;background:var(--raised);border-color:var(--raised);flex:none}
.btn svg{width:22px;height:22px}

/* ---------- lote ---------- */
.top{display:flex;align-items:center;gap:8px}
.back{width:44px;height:44px;margin-left:-10px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.stats b{font:600 15px var(--f-mono);color:var(--ink)}
.lrow{display:flex;gap:6px;align-items:center;padding:8px 4px 8px 8px;border-radius:14px;background:var(--surface)}
.lrow .body{flex:1;min-width:0;display:flex;gap:12px;align-items:center;border:0;background:none;padding:0;text-align:left}
.lrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lrow .nm b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm .c{font:500 12px var(--f-mono);color:var(--muted)}
.step{display:flex;align-items:center}
.step button{width:34px;height:44px;border:0;background:none;color:var(--muted);font-size:19px}
.step span{font:600 15px var(--f-mono);min-width:18px;text-align:center}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{min-height:40px;font-size:13.5px;padding:0 12px;border-radius:10px}
details.raw summary{cursor:pointer;color:var(--muted);font-size:13px}
details.raw textarea{width:100%;height:160px;margin-top:8px;font:12px/1.45 var(--f-mono);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);resize:vertical}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--flag-bg);font-size:13.5px}
.confirm span{flex:1}

/* ---------- câmera ---------- */
.cam{position:fixed;inset:0;z-index:20;background:#000;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* A leitura usa só a faixa de baixo da carta (sigla e número). A carta pode passar da tela:
   o que importa é a faixa ocupar o retângulo, para o texto ter pixels suficientes. */
.cam .zone{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:var(--ph,300px);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.cam .ghost{position:relative;flex:none;width:min(94vw,560px);aspect-ratio:63/88;border:2px dashed rgba(255,255,255,.3);border-bottom:0;border-radius:16px 16px 0 0}
.cam .shade{position:absolute;left:-1px;right:-1px;bottom:0;aspect-ratio:63/18;border-radius:10px;border:3px solid rgba(255,255,255,.9);box-shadow:0 0 0 9999px rgba(5,6,8,.55);transition:border-color .2s}
.cam .shade.hit{border-color:var(--accent)}
.cam .shade span{position:absolute;left:0;right:0;top:-30px;text-align:center;font-size:12.5px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.zoom{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(0,0,0,.55)}
.camdebug{position:absolute;left:var(--gut);right:var(--gutr);top:calc(env(safe-area-inset-top,0px) + 108px);z-index:2;padding:8px;border-radius:10px;background:rgba(0,0,0,.8);font:12px/1.35 var(--f-mono);color:#fff;display:flex;flex-direction:column;gap:6px}
.camdebug canvas{width:100%;height:auto;border-radius:4px;background:#fff}
.zoom button{min-width:44px;height:34px;border-radius:999px;border:0;background:transparent;color:#fff;font:600 13px var(--f-mono)}
.zoom button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cam .ctop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:var(--gut);right:var(--gutr);display:flex;justify-content:space-between;align-items:center;gap:10px}
.cbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff}
.cbtn svg{width:20px;height:20px}
.cbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{min-height:36px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.6);display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#fff;min-width:0}
.pill .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.pill .dot.off{background:var(--muted)}
.chipst{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--ph,300px) + min(94vw,560px) * 18 / 63 + 44px);max-width:calc(100% - 32px);min-height:36px;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0}
.chipst.ok{background:var(--accent);color:var(--accent-ink)}
.chipst.warn{background:var(--flag-bg);color:#FFD9CC}
.panel{position:absolute;left:0;right:0;bottom:0;padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 16px);background:#141518;border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:14px}
.panel .last{display:flex;align-items:center;gap:10px;padding:0 var(--gutr) 0 var(--gut)}
.panel .last .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.panel .last b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .last .nm>span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .sm{flex:none;height:40px;padding:0 12px;border-radius:10px;border:1px solid #2E3138;background:transparent;font-weight:700;font-size:13px}
.panel .sm.t{border:0;color:var(--accent);padding:0 6px}
.panel .film{display:flex;gap:8px;padding:0 var(--gutr) 0 var(--gut);overflow-x:auto;scrollbar-width:none;min-height:53px;align-items:center}
.panel .film .hint{font-size:13px;color:var(--muted)}
.panel .ctrls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;padding:2px 24px 0}
.ctl{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;font-weight:600;font-size:12px;color:#fff}
.ctl span{width:50px;height:50px;border-radius:50%;background:#24272D;display:flex;align-items:center;justify-content:center}
.ctl.done span{background:var(--ink);color:var(--bg)}
.ctl svg{width:22px;height:22px}
.shutter{justify-self:center;width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px}
.shutter span{width:100%;height:100%;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.shutter svg{width:24px;height:24px}

/* ---------- ficha da carta ---------- */
.sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet .scrim{position:absolute;inset:0;background:rgba(5,6,10,.6);border:0}
.sheet .box{position:relative;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px var(--gutr) calc(env(safe-area-inset-bottom,0px) + 20px) var(--gut);display:flex;flex-direction:column;gap:16px;max-width:600px;width:100%;margin:0 auto}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#3A3F4F;flex:none}
.head{display:flex;gap:14px;align-items:flex-start}
.head .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.head .code{font:600 13px var(--f-mono);color:var(--accent)}
.head h2{font-size:22px;font-weight:800;line-height:1.15}
.head small{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:7px}
.lbl,.field>label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{min-height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-size:16px;font-weight:600}
.field input:disabled{opacity:.6}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid #343949;background:transparent;font-size:13.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.seg.ext button{border-radius:8px}
.seg.ext button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
details.more summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13.5px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;background:var(--raised);min-height:46px}
.stepper button{width:40px;height:46px;border:0;background:none;font-size:20px}
.stepper output{font:700 16px var(--f-mono)}
.hint{font-size:12.5px;color:var(--flag);font-weight:600}
.actions{display:flex;flex-direction:column;gap:10px}
.actions .row2{display:flex;gap:10px}
.actions .row2 .btn{flex:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.cam .shade{transition:none}}
</style>
</head>
<body>

<!-- ============ INÍCIO: BUSCA ============ -->
<main class="view" id="home">
  <header style="display:flex;flex-direction:column;gap:14px">
    <div class="hrow">
      <span class="eyebrow" id="eyebrow">Scanner Liga</span>
      <div class="games" role="group" aria-label="Jogo" id="games">
        <button type="button" data-game="pk" aria-pressed="true">Pokémon</button>
        <button type="button" data-game="op" aria-pressed="false">One Piece</button>
      </div>
    </div>
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--muted);flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="sr">Buscar carta</span>
      <input type="search" id="q" placeholder="Nome, número ou sigla (ex.: MEW 063)" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" disabled>
      <button type="button" class="clear" id="qClear" aria-label="Limpar busca" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </label>
    <div class="chips" role="group" aria-label="Filtrar resultados" id="filters"></div>
  </header>

  <div id="status" class="notice" role="status" hidden></div>

  <section class="sec" id="resultsSec" hidden>
    <h2 id="resCount">Resultados</h2>
    <div class="list" id="results"></div>
    <button type="button" class="link" id="manualBtn">Não achou? Adicionar manualmente</button>
  </section>

  <div id="homeIdle" style="display:flex;flex-direction:column;gap:22px">
    <section class="sec" id="recentSec" hidden>
      <div class="sec-h"><h2>Adicionadas agora</h2><span class="muted" style="font-size:12.5px" id="recentWhen"></span></div>
      <div class="strip" id="recent"></div>
    </section>
    <section class="sec">
      <div class="sec-h"><h2>Lote para a Liga <span class="mono" style="color:var(--accent);font-weight:600" id="hCount">0</span></h2><button type="button" class="link" id="seeAll">Ver tudo</button></div>
      <div id="preview"></div>
    </section>
    <button type="button" class="link" id="galleryBtn">Ler a foto de uma carta da galeria</button>
    <input type="file" id="gallery" accept="image/*" hidden>
    <p class="foot" id="catInfo">Carregando o catálogo…</p>
  </div>
</main>

<!-- ============ LOTE ============ -->
<main class="view" id="lote" hidden>
  <header style="display:flex;flex-direction:column;gap:10px">
    <div class="top">
      <button type="button" class="back" id="loteBack" aria-label="Voltar para a busca"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 style="font-size:24px;font-weight:800;flex:1" id="loteTitle">Lote para a Liga</h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div id="loteList" style="display:flex;flex-direction:column;gap:8px"></div>
  <div class="tools" id="tools">
    <button type="button" class="btn" id="copyBtn">Copiar CSV</button>

  </div>

</main>

<nav class="dock" id="dockHome" aria-label="Ações">
  <div class="in">
    <button type="button" class="side" id="goLote">
      <span class="badge" id="dockCount" hidden>0</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="11" height="15" rx="2"/><path d="M9 21h8a2 2 0 0 0 2-2V8"/></svg>
      Lote
    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <button type="button" class="side" id="dlBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      Exportar CSV
    </button>

</nav>

<nav class="dock bar2" id="dockLote" aria-label="Ações do lote" hidden>
  <div class="in">
    <button type="button" class="btn round" id="openCam2" aria-label="Abrir câmera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button type="button" class="btn primary" id="dlBtn2" style="flex:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>Baixar CSV da Liga</button>

<!-- ============ CÂMERA CONTÍNUA ============ -->

  <video id="video" playsinline muted autoplay></video>

    <span class="pill" role="status" id="camPill" title="Toque para ver o que o leitor vê"><span class="dot off" id="camDot"></span><span id="camPillTxt">Abrindo câmera…</span></span>
    <button type="button" class="cbtn" id="torch" aria-label="Lanterna" aria-pressed="false" style="visibility:hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></button>
  </div>

    <div class="film" id="camFilm"></div>
    <div class="ctrls">
      <button type="button" class="ctl" id="camSearch" style="justify-self:start"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>Buscar</button>
      <button type="button" class="shutter" id="camPause" aria-label="Pausar leitura"><span id="camPauseIcon"></span></button>
      <button type="button" class="ctl done" id="camDone" style="justify-self:end"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Concluir</button>
    </div>

<!-- ============ FICHA DA CARTA ============ -->
<div class="sheet" id="sheet" hidden>
  <button type="button" class="scrim" id="sheetScrim" aria-label="Fechar"></button>
  <div class="box" id="sheetBox" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="core.js"></script>
<script src="core-op.js"></script>
<script>
"use strict";
const C = window.LigaCore;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const QUALS = ["M", "NM", "SP", "MP", "HP", "D"];
const LANGS = [["BR","Português"],["EN","Inglês"],["JP","Japonês"],["ES","Espanhol"],["FR","Francês"],["DE","Alemão"],["IT","Italiano"],["KO","Coreano"],["TW","Chinês"],["","Não informar"]];
const LANG_SHORT = { BR: "PT", EN: "EN", JP: "JP", ES: "ES", FR: "FR", DE: "DE", IT: "IT", KO: "KO", TW: "ZH", "": "—" };
const langName = v => (LANGS.find(l => l[0] === v) || [, "—"])[1];
/* Extras aceitos pela Liga, na ordem em que aparecem no CSV */
const EXTRAS_MAIN = ["Foil", "Reverse Foil", "Promo", "Pre Release", "Edition One", "Master Ball", "Pokeball Foil"];
const EXTRAS_MORE = ["Shadowless", "Textless", "Shattered Holo", "Staff", "Oversize", "Misprint", "Assinada", "Alterada"];
const EXTRAS = EXTRAS_MAIN.concat(EXTRAS_MORE);
/* Cor da miniatura quando não há imagem oficial: tipo da carta (códigos de cor da Liga) */
const TYPE_FILL = { G: "#2F6B4A", R: "#8A3B2E", W: "#2E5A8A", L: "#6E5C18", P: "#5E3C7E", F: "#7A5233", D: "#2F3340", M: "#4F5B66", Y: "#8A3E6A", O: "#6B5A2A", C: "#4A4F5E", E: "#3E4656" };
/* One Piece: cor da carta (Vermelha, Verde, azUl, roxa/Purple, preta/Black, amarela/Yellow, Multicolor) */
const OP_FILL = { R: "#8A3B2E", G: "#2F6B4A", U: "#2E5A8A", P: "#5E3C7E", B: "#2F3340", Y: "#7A6A1E", M: "#6A4A5E" };
/* One Piece: nos exports da LigaOnePiece só aparecem Foil e Promo */
const EXTRAS_OP_MAIN = ["Foil", "Promo"], EXTRAS_OP_MORE = ["Assinada", "Alterada", "Misprint"];
const O = window.LigaOP;
/* Cada jogo tem o próprio catálogo, lote e preferências, porque vão para sites diferentes da Liga */
const GAMES = {
  pk: { site: "LigaPokemon", catalog: "catalog.json", batchKey: "ligaScanner.batch.v1", prefsKey: "ligaScanner.prefs.v1", defLang: "BR", file: "lote-liga",
        q: "Nome, número ou sigla (ex.: MEW 063)", exMain: EXTRAS_MAIN, exMore: EXTRAS_MORE,
        chips: [["", "Todas"], ["jp", "Japonesas"], ["promo", "Promos"], ["old", "Antigas"]],
        film: "Aproxime até a faixa de baixo da carta ocupar o retângulo. Cada carta lida entra no lote sozinha." },
  op: { site: "LigaOnePiece", catalog: "catalog-op.json", batchKey: "ligaScanner.batch.op.v1", prefsKey: "ligaScanner.prefs.op.v1", defLang: "EN", file: "lote-ligaonepiece",
        q: "Código ou nome (ex.: OP07-038)", exMain: EXTRAS_OP_MAIN, exMore: EXTRAS_OP_MORE,
        chips: [["", "Todas"], ["promo", "Promos"], ["event", "Pré-release e eventos"], ["jp", "Japonesas"]],
        film: "Aproxime até a faixa de baixo da carta, com o código do canto direito, ocupar o retângulo." }
};

/* ---------- armazenamento local ---------- */
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let GAME = load("ligaScanner.game", "pk") === "op" ? "op" : "pk";
const G = () => GAMES[GAME];
const isOP = () => GAME === "op";
let batch = load(G().batchKey, []);
let prefs = load(G().prefsKey, { qual: "NM", lang: G().defLang });
let sigOverrides = load("ligaScanner.sigs.v1", {});
let IDX = null, OPX = null;
const ready = () => isOP() ? !!OPX : !!IDX;
const exAll = () => G().exMain.concat(G().exMore);
const nm = b => b.pt || b.en || "";              /* One Piece só tem o nome em inglês */

/* ---------- miniaturas ---------- */
function thumb(url, cor, size) {
  const fill = (isOP() ? OP_FILL[cor] : TYPE_FILL[cor]) || TYPE_FILL.C;
  return `<span class="thumb ${size || ""}" style="--t:${fill}" aria-hidden="true">${url ? `<img src="${esc(url)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</span>`;
}
const cardImg = (card, high) => !card ? "" : isOP() ? (OPX ? O.imageUrl(OPX, card) : "") : IDX ? C.imageUrl(IDX, card, high) : "";

/* ---------- catálogo (o de One Piece só é baixado quando o jogo é escolhido) ---------- */
const loading = {};
function loadCatalog(game) {
  if (loading[game] || (game === "op" ? OPX : IDX)) return loading[game];
  loading[game] = fetch(GAMES[game].catalog).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(cat => {
    if (game === "op") OPX = O.buildIndex(cat); else IDX = C.buildIndex(cat);
    if (game === GAME) catalogReady();
  }).catch(() => {
    loading[game] = null;
    if (game === GAME) {
      $("catInfo").textContent = `O catálogo não carregou. O arquivo ${GAMES[game].catalog} precisa estar na mesma pasta do index.html.`;
      showStatus("O catálogo não carregou. Confira a internet e recarregue a página.");
    }
  });
  return loading[game];
}
function catalogReady() {
  const ok = ready();
  $("openCam").disabled = !ok; $("q").disabled = !ok;
  if (!ok) { $("catInfo").textContent = "Carregando o catálogo…"; return; }
  showStatus("");
  if (isOP()) {
    const conf = OPX.cards.filter(c => c.ok).length;
    $("catInfo").textContent = `Catálogo: ${OPX.cards.length.toLocaleString("pt-BR")} cartas em ${OPX.sets.length} edições da LigaOnePiece (${conf.toLocaleString("pt-BR")} conferidas nos seus exports, o resto da base oficial da Bandai). Imagens: site oficial. O lote fica salvo neste aparelho.`;
  } else {
    $("catInfo").textContent = `Catálogo: ${IDX.cards.length.toLocaleString("pt-BR")} cartas de ${IDX.sets.length} coleções. Imagens: TCGdex e TCGplayer. O lote fica salvo neste aparelho.`;
  }
  /* cartas do lote ganham miniatura quando o catálogo carrega */
  let changed = false;
  for (const b of batch) {
    if (!isOP() && !b.ck) { const k = findKey(b); if (k) { b.ck = k; changed = true; } }
    const card = b.ck ? (isOP() ? OPX.byKey : IDX.byKey).get(b.ck) : null;
    if (!b.img && card) { b.img = cardImg(card); changed = true; }
    if (b.verified === undefined) { b.verified = !b.custom; changed = true; }
  }
  if (changed) persist(); else renderAll();
  if ($("q").value.trim()) runSearch();
}
/* liga uma linha antiga do lote (sem referência) à carta do catálogo pela sigla e número */
function findKey(b) {
  if (b.custom) return "";
  const hits = C.search(IDX, `${b.sig} ${b.num}`, 5);
  const hit = hits.find(c => C.ligaInfo(IDX, c, sigOverrides).sig === b.sig);
  return hit ? hit.key : "";
}
function showStatus(t) { const s = $("status"); s.textContent = t || ""; s.hidden = !t; }

/* ---------- busca ---------- */
let filter = "", results = [];
const isPromo = s => /promo/i.test(s.en) || /(P|PR|-P|Jp|JP)$/.test(s.ligaSig || s.sig || "");
function applyFilter(list) {
  if (isOP()) {
    if (filter === "promo") return list.filter(c => c.set.kind === "promo");
    if (filter === "event") return list.filter(c => c.set.kind === "event");
    if (filter === "jp") return list.filter(c => /-JP$/.test(c.num));
    return list;
  }
  if (filter === "jp") return list.filter(c => c.set.jp);
  if (filter === "promo") return list.filter(c => isPromo(c.set));
  if (filter === "old") return list.filter(c => c.set.rel && c.set.rel < "2011");
  return list;
}
function runSearch() {
  const v = $("q").value.trim();
  $("qClear").hidden = !v;
  if (!v || !ready()) { $("resultsSec").hidden = true; $("homeIdle").hidden = false; return; }
  results = applyFilter(isOP() ? O.search(OPX, v, 300) : C.search(IDX, v, 300)).slice(0, 40);
  $("homeIdle").hidden = true; $("resultsSec").hidden = false;
  $("resCount").textContent = results.length ? `${results.length}${results.length === 40 ? "+" : ""} resultados` : "Nada encontrado";
  $("results").innerHTML = results.map((c, i) => {
    if (isOP()) return `<button type="button" class="row" data-r="${i}">${thumb(cardImg(c), c.cor, "")}
      <span class="nm"><b>${esc(c.name)}</b><span><span class="mono" style="color:var(--accent)">${esc(c.num)}</span> · ${esc(O.label(OPX, c))} · ${esc(c.set.sig)}${c.ok ? "" : " · conferir"}</span></span></button>`;
    const L = C.ligaInfo(IDX, c, sigOverrides);
    const sub = `${c.set.pt || c.set.en}${c.set.rel ? " · " + c.set.rel.slice(0, 4) : ""}`;
    return `<button type="button" class="row" data-r="${i}">${thumb(cardImg(c), L.cor, "")}
      <span class="nm"><b>${esc(L.pt)}</b><span><span class="mono" style="color:var(--accent)">${esc(L.sig)} ${esc(L.num)}</span> · ${esc(sub)}</span></span></button>`;
  }).join("");
}
let qTimer;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 160); });
$("qClear").onclick = () => { $("q").value = ""; runSearch(); $("q").focus(); };
function renderChips() {
  $("filters").innerHTML = G().chips.map(([v, l]) => `<button type="button" class="chip" data-f="${v}" aria-pressed="${v === filter}">${esc(l)}</button>`).join("");
}
$("filters").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  filter = b.dataset.f;
  $("filters").querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
  runSearch();
});
$("results").addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (b) openSheet({ mode: "add", card: results[+b.dataset.r] }); });
$("manualBtn").onclick = () => openSheet({ mode: "add", card: null });

/* ---------- telas ---------- */
function show(view) {
  $("home").hidden = view !== "home"; $("dockHome").hidden = view !== "home";
  $("lote").hidden = view !== "lote"; $("dockLote").hidden = view !== "lote";
  window.scrollTo(0, 0);
}
$("goLote").onclick = $("seeAll").onclick = () => show("lote");
$("loteBack").onclick = () => show("home");

/* ---------- lote ---------- */
function persist() { save(G().batchKey, batch); renderAll(); }
const total = () => batch.reduce((a, b) => a + b.qty, 0);
const needsCheck = b => b.custom || b.verified === false;
function tagsHTML(b) {
  return `<span class="tags"><span class="tag">${esc(b.qual)}</span><span class="tag">${esc(LANG_SHORT[b.lang] ?? b.lang)}</span>${b.ext ? `<span class="tag x">${esc(b.ext)}</span>` : ""}${needsCheck(b) ? '<span class="tag f">conferir</span>' : ""}</span>`;
}
function renderAll() {
  const n = total(), flags = batch.filter(needsCheck).length;
  $("hCount").textContent = n;
  $("dockCount").textContent = n; $("dockCount").hidden = !n;
  const rec = batch.slice(0, 12);
  $("recentSec").hidden = !rec.length;
  $("recent").innerHTML = rec.map((b, i) => `<button type="button" class="it" data-e="${i}" aria-label="Editar ${esc(nm(b))}">${thumb(b.img, b.cor, "m")}<b>${esc(nm(b))}</b><span>${esc(b.sig)} ${esc(b.num)}</span></button>`).join("");
  $("recentWhen").textContent = rec.length && rec[0].at ? new Date(rec[0].at).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  $("preview").innerHTML = batch.length
    ? `<div class="list">${batch.slice(0, 3).map((b, i) => `<button type="button" class="row" data-e="${i}">${thumb(b.img, b.cor, "s")}<span class="nm"><b>${esc(nm(b))}</b><span><span class="mono">${esc(b.sig)} ${esc(b.num)}</span> · ${esc(b.qual)} · ${esc(LANG_SHORT[b.lang] ?? b.lang)}${b.ext ? " · " + esc(b.ext) : ""}</span></span><span class="q">×${b.qty}</span></button>`).join("")}</div>`
    : `<div class="empty"><b>Nenhuma carta no lote ainda.</b><ol><li>Toque no botão da câmera e encaixe a carta na moldura. A leitura é contínua.</li><li>Se a carta não for reconhecida, busque pelo nome ou número.</li><li>Exporte o CSV e importe em Minha Coleção na ${G().site}.</li></ol></div>`;
  $("stats").innerHTML = `<span><b>${n}</b> ${n === 1 ? "carta" : "cartas"}</span><span><b>${batch.length}</b> ${batch.length === 1 ? "linha" : "linhas"}</span>${flags ? `<span><b style="color:var(--flag)">${flags}</b> para conferir</span>` : ""}`;
  $("loteList").innerHTML = batch.length ? batch.map((b, i) => `<div class="lrow">
      <button type="button" class="body" data-e="${i}" aria-label="Editar ${esc(nm(b))}">${thumb(b.img, b.cor, "")}
        <span class="nm"><b>${esc(nm(b))}</b><span class="c">${esc(b.sig)} ${esc(b.num)}</span>${tagsHTML(b)}</span></button>
      <span class="step"><button type="button" data-i="${i}" data-d="-1" aria-label="Diminuir ${esc(nm(b))}">−</button><span>${b.qty}</span><button type="button" data-i="${i}" data-d="1" aria-label="Aumentar ${esc(nm(b))}">+</button></span>
    </div>`).join("") : `<div class="empty"><b>O lote está vazio.</b><span class="muted">Abra a câmera para começar.</span></div>`;
  $("tools").hidden = !batch.length;
  $("loteTitle").textContent = `Lote para a ${G().site}`;
  $("raw").value = csv();
}
document.addEventListener("click", e => {
  if (e.target.closest(".sheet") || e.target.closest(".cam")) return;
  const ed = e.target.closest("[data-e]");
  if (ed) { openSheet({ mode: "edit", index: +ed.dataset.e }); return; }
  const st = e.target.closest("#loteList [data-d]");
  if (st) {
    const it = batch[+st.dataset.i]; it.qty += +st.dataset.d;
    if (it.qty <= 0) batch.splice(+st.dataset.i, 1);
    persist();
  }
});
$("clearBtn").onclick = () => { $("confirmClear").hidden = false; };
$("clearNo").onclick = () => { $("confirmClear").hidden = true; };
$("clearYes").onclick = () => { batch = []; persist(); $("confirmClear").hidden = true; toast("Lote apagado."); };

/* adiciona uma linha ao lote (junta com uma igual e traz para o topo) */
function addEntry(p) {
  const key = [p.sig, p.num, p.pt || p.en, p.ext, p.qual, p.lang].join("|");
  const ex = batch.find(b => b.key === key);
  if (ex) { ex.qty += p.qty; ex.at = Date.now(); batch.splice(batch.indexOf(ex), 1); batch.unshift(ex); persist(); return ex; }
  const e = { key, sig: p.sig, ed: p.ed, edEn: p.edEn, pt: p.pt, en: p.en, rar: p.rar, cor: p.cor, num: p.num, tot: p.tot, ext: p.ext,
    exts: (p.exts || []).slice(), ver: p.ver || "", qual: p.qual, lang: p.lang, qty: p.qty, custom: !!p.custom, verified: p.custom ? false : !!p.verified,
    ck: p.card ? p.card.key : "", img: p.card ? cardImg(p.card) : "", at: Date.now() };
  batch.unshift(e); persist(); return e;
}
function entryFromCard(card, o) {
  o = o || {};
  const L = C.ligaInfo(IDX, card, sigOverrides, o.ver || "");
  const exts = (o.exts || []).slice();
  return { card, sig: L.sig, num: L.num, ed: L.ed, edEn: L.edEn, pt: L.pt, en: L.en, rar: L.rar, cor: L.cor, tot: L.tot, verified: L.verified,
    jpOnly: L.jpOnly, ver: o.ver || "", exts, ext: EXTRAS.filter(x => exts.includes(x)).join(", "), qual: o.qual || prefs.qual,
    lang: o.lang || (card.set.jp ? "JP" : prefs.lang), qty: o.qty || 1 };
}

/* ---------- exportar ---------- */
const csv = () => (isOP() ? O : C).buildCSV(batch.slice().reverse());
function fileName() { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${G().file}-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.csv`; }
function download() {
  if (!batch.length) { toast("Adicione cartas antes de exportar."); return; }
  const url = URL.createObjectURL(new Blob([csv()], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = fileName(); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
$("dlBtn").onclick = $("dlBtn2").onclick = download;

        try { await scanOnce(); } catch (e) { /* um quadro ruim não interrompe a leitura */ }

  camChip(`✓ ${card.name} · ${hit.code}${cands.length > 1 ? ` · ${cands.length} versões, toque para trocar` : ""}`, "ok", cands.length > 1 ? edit : null);

}
function opEntry(card, o) {
  o = o || {};
  const exts = (o.exts || []).slice();
  return Object.assign({ card }, O.rowOf(card), { verified: !!card.ok, custom: false, exts, ext: exAll().filter(x => exts.includes(x)).join(", "),
    qual: o.qual || prefs.qual, lang: o.lang || (/-JP$/.test(card.num) ? "JP" : prefs.lang), qty: o.qty || 1 });
}
function renderCamPanel() {
  const last = session[0];
  $("camLast").hidden = !last;
  if (last) {
    $("camLast").innerHTML = `${thumb(last.img, last.cor, "")}
      <span class="nm"><b>${esc(nm(last))} <span class="mono" style="color:var(--muted);font-size:13px;font-weight:600">×${last.qty}</span></b><span><span class="mono">${esc(last.sig)} ${esc(last.num)}</span> · ${esc(last.qual)} · ${esc(langName(last.lang))}</span></span>
      <button type="button" class="sm" id="camEdit">Editar</button><button type="button" class="sm t" id="camUndo">Desfazer</button>`;
    $("camEdit").onclick = () => { const i = batch.indexOf(last); if (i >= 0) openSheet({ mode: "edit", index: i }); };
    $("camUndo").onclick = () => {
      const i = batch.indexOf(last);
      if (i >= 0) { last.qty -= 1; if (last.qty <= 0) batch.splice(i, 1); persist(); }
      session.shift(); lastKey = null; camChip(""); renderCamPanel(); setPaused(paused);
    };
  }
  $("camFilm").innerHTML = session.length
    ? session.slice(0, 14).map(e => thumb(e.img, e.cor, "s")).join("")
    : `<span class="hint">${esc(G().film)}</span>`;
}

/* ---------- foto da galeria: lê uma vez e abre a ficha ---------- */
$("galleryBtn").onclick = () => $("gallery").click();
$("gallery").onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f || !ready()) return;
  showStatus("Lendo a foto…");
  try {
    const bmp = await createImageBitmap(f);
    const W = 900, H = Math.round(W * 88 / 63);
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    c.getContext("2d").drawImage(bmp, 0, 0, W, H);
    const w = await getWorker();
    if (isOP()) {
      const hit = await readCodeOP(w, c);
      showStatus("");
      if (hit && hit.known) openSheet({ mode: "add", card: O.candidates(OPX, hit.code)[0] });
      else if (hit) { goSearch(hit.code); showStatus(`Li ${hit.code}, mas esse código não está no catálogo. Confira na busca ou adicione manualmente.`); }
      else showStatus("Não achei o código nessa foto. Tente outra com o canto de baixo nítido, ou busque pelo código.");
      return;
    }
    const parsed = await readNumber(w, c);
    const r = C.resolve(IDX, parsed, await ocrName(w, c));
    showStatus("");
    if (r.auto) openSheet({ mode: "add", card: r.auto, read: parsed });
    else if (r.ranked.length) openSheet({ mode: "choose", list: r.ranked.map(x => x.card), read: parsed });
    else showStatus("Não achei a carta nessa foto. Tente outra com a faixa de baixo nítida, ou busque pelo nome.");
  } catch (err) { showStatus(window.Tesseract ? "Não consegui ler essa foto." : "O leitor de texto não carregou. Confira a internet."); }
};

/* ---------- ficha da carta: adicionar, escolher entre várias, editar ---------- */
let S = null;
const sheetOpen = () => !$("sheet").hidden;
function openSheet(o) {
  if (!ready() && o.mode !== "edit") return;
  if (o.mode === "choose") {
    S = { mode: "choose", list: o.list, read: o.read };
  } else if (o.mode === "edit") {
    const b = batch[o.index]; if (!b) return;
    const card = b.ck && ready() ? (isOP() ? OPX.byKey : IDX.byKey).get(b.ck) : null;
    const exts = b.exts && b.exts.length ? b.exts.slice() : (b.ext ? b.ext.split(", ") : []);
    let p;
    if (card && isOP()) {
      p = opEntry(card, { exts, qual: b.qual, lang: b.lang, qty: b.qty });
      if (b.sig !== p.sig || b.num !== p.num) Object.assign(p, { sig: b.sig, num: b.num, edEn: b.edEn, custom: b.custom, verified: b.verified });
    } else if (card) {
      p = entryFromCard(card, { ver: b.ver, exts, qual: b.qual, lang: b.lang, qty: b.qty });
      if (!b.ver && b.sig !== p.sig) p.sig = b.sig;
    } else {
      p = Object.assign({}, b, { exts });
    }
    S = { mode: "edit", entry: b, card, p };
  } else {
    const card = o.card;
    S = { mode: "add", card, read: o.read,
      p: card ? (isOP() ? opEntry(card) : entryFromCard(card, { lang: o.read && o.read.langCode }))
              : { sig: "", num: "", pt: "", en: "", ed: "", edEn: "", rar: "", cor: "", tot: "", exts: [], ext: "", qual: prefs.qual, lang: prefs.lang, qty: 1, custom: true } };
  }
  renderSheet();
  $("sheet").hidden = false; document.body.style.overflow = "hidden";
  $("sheetBox").scrollTop = 0;
}
function closeSheet() { $("sheet").hidden = true; S = null; if (!camOpen) document.body.style.overflow = ""; }
$("sheetScrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetOpen()) closeSheet(); });

const seg = (name, opts, val) => `<div class="seg" role="group" data-seg="${name}">${opts.map(([v, l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${v === val}">${esc(l)}</button>`).join("")}</div>`;
const extSeg = (list, sel) => `<div class="seg ext" role="group" data-multi="1">${list.map(x => `<button type="button" data-x="${esc(x)}" aria-pressed="${sel.includes(x)}">${esc(x)}</button>`).join("")}</div>`;

/* extras, qualidade, idioma, quantidade e botões: iguais nos dois jogos */
function commonSheetHTML(p, editing, c) {
  const g = G();
  return `<div class="field"><span class="lbl">Extras</span>${extSeg(g.exMain, p.exts)}
      <details class="more"${p.exts.some(x => g.exMore.includes(x)) ? " open" : ""}><summary>Mais extras</summary>${extSeg(g.exMore, p.exts)}</details></div>
    <div class="field"><span class="lbl">Qualidade</span>${seg("qual", QUALS.map(q => [q, q]), p.qual)}</div>
    <div class="grid2">
      <div class="field"><label for="pLang">Idioma</label><select id="pLang">${LANGS.map(([v, l]) => `<option value="${v}"${v === p.lang ? " selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="field"><span class="lbl">Quantidade</span><div class="stepper"><button type="button" data-step="-1" aria-label="Menos">−</button><output id="pQty">${p.qty}</output><button type="button" data-step="1" aria-label="Mais">+</button></div></div>
    </div>
    <div class="actions">
      <button type="button" class="btn primary" data-act="save">${editing ? "Salvar" : "Adicionar ao lote"}</button>
      <div class="row2">${editing ? '<button type="button" class="btn" data-act="remove">Remover do lote</button>' : '<button type="button" class="btn" data-act="cancel">Cancelar</button>'}${c && !editing ? '<button type="button" class="btn" data-act="search">Não é essa</button>' : ""}</div>
    </div>`;
}
/* One Piece: versão na Liga (mesmo código impresso), sigla da edição e Card # editáveis */
function renderSheetOP() {
  const box = $("sheetBox"), p = S.p, c = S.card, editing = S.mode === "edit";
  let head, ident;
  if (c) {
    const cands = O.candidates(OPX, c.base || c.num), miss = c.base ? O.missingAlts(OPX, c.base) : 0;
    head = `<div class="head">${thumb(cardImg(c), c.cor, "l")}<div class="nm"><span class="code">${esc(p.sig)} · ${esc(p.num)}</span><h2 id="sheetTitle">${esc(c.name)}</h2><small>${esc(c.set.en)} · ${esc(O.label(OPX, c))}</small><small>${[c.rar, O.COLORS[c.cor]].filter(Boolean).map(esc).join(" · ")}</small></div></div>`;
    ident = `${cands.length > 1 ? `<div class="field"><label for="pVer">Versão na Liga (${cands.length})</label><select id="pVer">${cands.map((x, i) => `<option value="${i}"${x === c ? " selected" : ""}>${esc(O.label(OPX, x))} · ${esc(x.set.sig)}${x.ok ? "" : " (conferir)"}</option>`).join("")}</select><span class="muted" style="font-size:12.5px">Pré-release, parallel e promos têm o mesmo código impresso. Escolha a sua.</span></div>` : ""}
      ${c.ok ? "" : `<div class="note"><b>Carta da base oficial.</b> Ainda não está nos seus exports da LigaOnePiece, então o nome e o Card # podem estar um pouco diferentes. Confira antes de importar.</div>`}
      ${miss ? `<div class="note"><b>${miss} arte${miss > 1 ? "s" : ""} alternativa${miss > 1 ? "s" : ""} fora do catálogo.</b> Se a sua for uma delas, ajuste o Card # abaixo (o sufixo muda por edição, por exemplo -PA ou -AA).</div>` : ""}
      <div class="grid2">
        <div class="field"><label for="pSig">Sigla da edição</label><input type="text" id="pSig" value="${esc(p.sig)}" autocapitalize="characters" autocorrect="off" spellcheck="false"></div>
        <div class="field"><label for="pNum">Card #</label><input type="text" id="pNum" value="${esc(p.num)}" autocapitalize="characters" autocorrect="off" spellcheck="false"></div>
      </div>`;
  } else {
    head = `<div class="head"><div class="nm"><span class="code">entrada manual</span><h2 id="sheetTitle">${editing ? esc(nm(p)) : "Adicionar manualmente"}</h2><small>Preencha como aparece na LigaOnePiece: a sigla da edição (ex.: OP-07-PR) e o Card # (ex.: OP07-038-PA).</small></div></div>`;
    ident = `<div class="grid2"><div class="field"><label for="cSig">Sigla da edição</label><input type="text" id="cSig" value="${esc(p.sig)}" autocapitalize="characters" autocorrect="off" spellcheck="false"></div><div class="field"><label for="cNum">Card #</label><input type="text" id="cNum" value="${esc(p.num)}" autocapitalize="characters" autocorrect="off" spellcheck="false"></div></div>
      <div class="field"><label for="cEn">Nome da carta</label><input type="text" id="cEn" value="${esc(p.en)}"></div>
      <div class="field"><label for="cEd">Edição (opcional)</label><input type="text" id="cEd" value="${esc(p.edEn)}"></div>`;
  }
  box.innerHTML = `<div class="grab"></div>${head}${ident}${commonSheetHTML(p, editing, c)}`;
}
function renderSheet() {
  const box = $("sheetBox");
  if (isOP() && S.mode !== "choose") { renderSheetOP(); return; }
  if (S.mode === "choose") {
    const r = S.read || {};
    box.innerHTML = `<div class="grab"></div>
      <div class="head"><div class="nm"><span class="code">${esc(`${r.sig || ""} ${r.num || ""}${r.tot ? "/" + r.tot : ""}`.trim())}</span><h2 id="sheetTitle">Qual destas é a sua carta?</h2><small>${S.list.length} cartas têm esse número.</small></div></div>
      <div class="list">${S.list.slice(0, 15).map((c, i) => { const L = C.ligaInfo(IDX, c, sigOverrides); return `<button type="button" class="row" data-c="${i}">${thumb(cardImg(c), L.cor, "")}<span class="nm"><b>${esc(L.pt)}</b><span><span class="mono" style="color:var(--accent)">${esc(L.sig)} ${esc(L.num)}</span> · ${esc(c.set.pt || c.set.en)}${c.set.rel ? " · " + c.set.rel.slice(0, 4) : ""}</span></span></button>`; }).join("")}</div>
      <div class="actions"><button type="button" class="btn" data-act="search">Nenhuma delas: buscar</button></div>`;
    return;
  }
  const p = S.p, c = S.card, editing = S.mode === "edit";
  const vers = c ? C.versions(IDX, c) : [];
  const head = c
    ? `<div class="head">${thumb(cardImg(c, true), p.cor, "l")}<div class="nm"><span class="code">${esc(p.sig)} · ${esc(p.num)}${p.tot ? "/" + esc(p.tot) : ""}</span><h2 id="sheetTitle">${esc(p.pt)}</h2>${p.en !== p.pt ? `<small>${esc(p.en)}</small>` : ""}${c.set.jp && c.ja && c.ja !== p.pt ? `<small>${esc(c.ja)}</small>` : ""}<small>${esc(c.set.pt || c.set.en)}${c.set.rel ? " · " + esc(c.set.rel.slice(0, 4)) : ""}</small></div></div>`
    : `<div class="head"><div class="nm"><span class="code">entrada manual</span><h2 id="sheetTitle">${editing ? esc(p.pt) : "Adicionar manualmente"}</h2><small>Para cartas fora do catálogo. Preencha como aparece na Liga.</small></div></div>`;
  const ident = c
    ? `${p.jpOnly ? `<div class="field"><label for="pEn">Nome em inglês</label><input type="text" id="pEn" value="" placeholder="Ex.: Ultra Ball"><span class="hint">Sem nome em inglês no catálogo. Se deixar em branco, vai em japonês.</span></div>` : ""}
       ${vers.length ? `<div class="field"><span class="lbl">Versão na Liga</span>${seg("ver", [["", "Normal"]].concat(vers.map(v => [v.sig, v.label])), p.ver)}</div>` : ""}
       <div class="field"><label for="pSig">Sigla na Liga</label><input type="text" id="pSig" value="${esc(p.sig)}" autocapitalize="off" autocorrect="off" spellcheck="false"${p.ver ? " disabled" : ""}>${p.verified ? "" : '<span class="hint">Sigla ainda não confirmada na Liga. Confira antes de importar.</span>'}</div>`
    : `<div class="grid2"><div class="field"><label for="cSig">Sigla</label><input type="text" id="cSig" value="${esc(p.sig)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div><div class="field"><label for="cNum">Número</label><input type="text" id="cNum" value="${esc(p.num)}"></div></div>
       <div class="field"><label for="cPt">Nome (PT)</label><input type="text" id="cPt" value="${esc(p.pt)}"></div>
       <div class="field"><label for="cEn">Nome (EN)</label><input type="text" id="cEn" value="${esc(p.en)}"></div>
       <div class="field"><label for="cEd">Coleção (opcional)</label><input type="text" id="cEd" value="${esc(p.ed)}"></div>`;
  box.innerHTML = `<div class="grab"></div>${head}${ident}${commonSheetHTML(p, editing, c)}`;
}
/* One Piece: trocar a versão troca a carta (nome, Card #, edição), mantendo extras, qualidade e quantidade */
$("sheetBox").addEventListener("change", e => {
  if (e.target.id !== "pVer" || !S || !S.card || !isOP()) return;
  const c = O.candidates(OPX, S.card.base || S.card.num)[+e.target.value]; if (!c) return;
  const wasJP = /-JP$/.test(S.p.num), lang = $("pLang").value;
  S.card = c;
  Object.assign(S.p, opEntry(c, { exts: S.p.exts, qual: S.p.qual, qty: S.p.qty, lang: /-JP$/.test(c.num) ? "JP" : wasJP && lang === "JP" ? prefs.lang : lang }));
  const top = $("sheetBox").scrollTop; renderSheet(); $("sheetBox").scrollTop = top;
});
$("sheetBox").addEventListener("click", e => {
  if (!S) return;
  const ch = e.target.closest("[data-c]");
  if (ch) { openSheet({ mode: "add", card: S.list[+ch.dataset.c], read: S.read }); return; }
  const x = e.target.closest("[data-multi] button");
  if (x) { const v = x.dataset.x, i = S.p.exts.indexOf(v); if (i >= 0) S.p.exts.splice(i, 1); else S.p.exts.push(v); x.setAttribute("aria-pressed", String(i < 0)); return; }
  const s = e.target.closest("[data-seg] button");
  if (s) {
    const k = s.parentElement.dataset.seg; S.p[k] = s.dataset.v;
    s.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === s)));
    if (k === "ver" && S.card) {
      S.p.lang = $("pLang").value;
      const L = C.ligaInfo(IDX, S.card, sigOverrides, S.p.ver);
      Object.assign(S.p, { sig: L.sig, num: L.num, ed: L.ed, edEn: L.edEn });
      const top = $("sheetBox").scrollTop; renderSheet(); $("sheetBox").scrollTop = top;
    }
    return;
  }
  const st = e.target.closest("[data-step]");
  if (st) { S.p.qty = Math.max(1, S.p.qty + +st.dataset.step); $("pQty").textContent = S.p.qty; return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act, read = S.read;
  if (a === "cancel") closeSheet();
  else if (a === "search") goSearch(read && read.num ? read.num : undefined);
  else if (a === "remove") {
    const i = batch.indexOf(S.entry);
    if (i >= 0) batch.splice(i, 1);
    session = session.filter(e2 => batch.includes(e2));
    persist(); closeSheet(); renderCamPanel(); toast("Removida do lote.");
  } else if (a === "save") saveSheet();
});
function saveSheet() {
  const p = S.p;
  let c = S.card;
  p.lang = $("pLang").value;
  if (isOP()) {
    const up = id => ($(id).value || "").trim().toUpperCase();
    if (!c) {
      p.sig = up("cSig"); p.num = up("cNum"); p.en = C.fold($("cEn").value.trim()); p.pt = ""; p.ed = "";
      const st = OPX.sigs.get(p.sig);
      p.edEn = C.fold($("cEd").value.trim()) || (st ? st.en : "");
      if (!p.sig || !p.num || !p.en) { toast("Preencha sigla, Card # e nome."); return; }
      p.custom = true; p.verified = false;
    } else {
      const sig = up("pSig"), num = up("pNum");
      if (!sig || !num) { toast("Informe a sigla da edição e o Card #."); return; }
      const keep = { exts: p.exts, qual: p.qual, lang: p.lang, qty: p.qty };
      if (sig !== c.set.up || num !== c.num) {
        /* sigla ou Card # trocados à mão: procura a carta certa para manter nome e edição */
        const hit = OPX.cards.find(x => x.set.up === sig && x.num === num);
        if (hit) { c = hit; Object.assign(p, opEntry(hit, keep)); }
        else { Object.assign(p, opEntry(c, keep), { sig, num, custom: true, verified: false }); const st = OPX.sigs.get(sig); if (st) p.edEn = st.en; }
      } else Object.assign(p, opEntry(c, keep));
    }
  } else if (!c) {
    p.sig = $("cSig").value.trim(); p.num = $("cNum").value.trim();
    p.pt = C.fold($("cPt").value.trim()); p.en = C.fold($("cEn").value.trim());
    p.ed = C.fold($("cEd").value.trim()); p.edEn = p.ed;
    if (!p.sig || !p.num || !(p.pt || p.en)) { toast("Preencha sigla, número e pelo menos um nome."); return; }
    if (!p.pt) p.pt = p.en; if (!p.en) p.en = p.pt;
    p.custom = true;
  } else {
    if (!p.ver) {
      const defSig = C.ligaInfo(IDX, c, {}).sig;
      const sig = ($("pSig").value || "").trim() || defSig;
      if (sig !== C.ligaInfo(IDX, c, sigOverrides).sig) {
        if (sig === defSig) delete sigOverrides[c.set.id]; else sigOverrides[c.set.id] = sig;
        save("ligaScanner.sigs.v1", sigOverrides);
      }
    }
    Object.assign(p, entryFromCard(c, { ver: p.ver, exts: p.exts, qual: p.qual, lang: p.lang, qty: p.qty }));
    if (!p.sig) { toast("Informe a sigla da coleção na Liga."); return; }
    const enIn = $("pEn");
    if (enIn && enIn.value.trim()) { p.en = p.pt = C.fold(enIn.value.trim()); }
  }
  p.ext = exAll().filter(x => p.exts.includes(x)).join(", ");
  /* o idioma das japonesas não vira padrão para as próximas cartas */
  const jpCard = isOP() ? /-JP$/.test(p.num) : c && c.set.jp;
  prefs = { qual: p.qual, lang: jpCard ? prefs.lang : p.lang }; save(G().prefsKey, prefs);
  if (S.mode === "edit") {
    const old = S.entry, si = session.indexOf(old), i = batch.indexOf(old);
    if (i >= 0) batch.splice(i, 1);
    const e = addEntry(Object.assign({}, p, { card: c }));
    if (si >= 0) session[si] = e;
    toast("Alterações salvas.");
  } else {
    const e = addEntry(Object.assign({}, p, { card: c }));
    if (camOpen) { session.unshift(e); if (c) lastKey = isOP() ? c.base : c.key; }
    toast(`${nm(e)} adicionada (${p.qty}×).`);
    if (!camOpen) { $("q").value = ""; runSearch(); }
  }
  closeSheet(); renderCamPanel(); if (camOpen) setPaused(paused);
}

/* ---------- troca de jogo ---------- */
function applyGame() {
  document.body.dataset.game = GAME;
  $("games").querySelectorAll("[data-game]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.game === GAME)));
  $("q").placeholder = G().q; filter = ""; renderChips();
  catalogReady(); loadCatalog(GAME);
}
$("games").addEventListener("click", e => {
  const b = e.target.closest("[data-game]"); if (!b || b.dataset.game === GAME) return;
  GAME = b.dataset.game; save("ligaScanner.game", GAME);
  batch = load(G().batchKey, []); prefs = load(G().prefsKey, { qual: "NM", lang: G().defLang });
  $("q").value = ""; $("confirmClear").hidden = true; session = []; showStatus("");
  applyGame(); runSearch(); renderAll();
});

let tt; function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2400); }
applyGame();
renderAll();
</script>
</body>
</html>
