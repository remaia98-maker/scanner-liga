name: Atualizar catálogo

on:
  schedule:
    - cron: "17 9 * * 1"   # toda segunda-feira, 06:17 em Brasília
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar a base do TCGdex
        run: git clone --depth 1 https://github.com/tcgdex/cards-database /tmp/tcgdex

      - name: Baixar nomes em inglês das japonesas (TCGplayer, via tcgcsv.com)
        run: python3 tools/fetch_tcgplayer_jp.py /tmp/tcgplayer-jp.json || echo "TCGCSV indisponivel, seguindo sem"

      - name: Baixar a lista de imagens oficiais do TCGdex
        run: curl -fsSL -A "ScannerLiga/1.0" https://assets.tcgdex.net/datas.json -o /tmp/tcgdex-imagens.json || echo "lista de imagens indisponivel"

      - name: Gerar catalog.json
        run: python3 tools/build_catalog.py /tmp/tcgdex/data catalog.json liga /tmp/tcgplayer-jp.json /tmp/tcgdex-imagens.json

      - name: Baixar a base oficial de One Piece (punk-records, gerada do site da Bandai)
        run: git clone --depth 1 https://github.com/buhbbl/punk-records /tmp/punk-records || echo "base de One Piece indisponivel"

      - name: Baixar os códigos das cartas de One Piece no TCGplayer (miniaturas, via tcgcsv.com)
        run: python3 tools/fetch_tcgplayer_op.py /tmp/tcgplayer-op.json || echo "TCGCSV indisponivel, seguindo sem"

      - name: Gerar catalog-op.json (One Piece)
        run: |
          if [ -d /tmp/punk-records/english ]; then
            python3 tools/build_catalog_op.py /tmp/punk-records/english catalog-op.json liga-op /tmp/tcgplayer-op.json
          else
            echo "Sem a base oficial: o catalog-op.json fica como estava."
          fi

      - name: Salvar se mudou
        run: |
          if git diff --quiet catalog.json catalog-op.json; then
            echo "Nenhuma coleção nova."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add catalog.json catalog-op.json
            git commit -m "Atualiza catálogo ($(date +%Y-%m-%d))"
            git push
          fi
